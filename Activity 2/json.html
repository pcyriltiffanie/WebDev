<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Psychology of Everyday Life</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --forest: #1e3a2f;
      --cream: #f7f4ef;
      --bs-body-font-family: 'Inter', system-ui, sans-serif;
      --bs-body-bg: var(--cream);
      --bs-body-color: var(--forest);
    }

    .back-btn {
      background: transparent;
      color: var(--forest);
      border: 2px solid var(--forest);
      border-radius: 50rem;
      padding: 8px 28px;
      font-weight: 500;
    }

    .back-btn:hover {
      background: var(--forest);
      color: var(--cream);
      border-color: var(--forest);
    }

    .page-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--forest);
    }

    .page-subtitle {
      color: var(--forest);
      opacity: 0.7;
      margin-bottom: 1.5rem;
    }

    .topic-card {
      background: #fff;
      border: 0;
      border-left: 5px solid var(--forest);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .topic-card:hover {
      transform: translateY(-3px);
    }

    .category-tag {
      display: inline-block;
      background: var(--forest);
      color: var(--cream);
      font-size: 0.72rem;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 50rem;
    }

    .topic-title {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      color: var(--forest);
      margin-top: 0.75rem;
    }

    .examples-label {
      border-bottom: 2px solid var(--cream);
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <a href="https://pcyriltiffanie.github.io/WebDev/index.html" class="btn back-btn mt-4">Back</a>
    <h1 class="page-title my-4">Psychology of Everyday Life</h1>
    <p class="page-subtitle">Why we think, feel, and act the way we do in ordinary moments.</p>
    <div class="row" id="parent">



    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    var topics = [
      {
        title: "Confirmation Bias",
        category: "Thinking",
        description: "We tend to notice and remember information that agrees with what we already believe, and ignore what does not.",
        examples: [
          {
            situation: "School",
            detail: "You think a classmate is lazy, so you only remember the times they came late."
          },
          {
            situation: "Social media",
            detail: "You only follow pages that agree with your opinions."
          }
        ]
      }, {
        title: "Procrastination",
        category: "Thinking",
        description: "Delaying a task even when we know it will cause problems later. It is often about managing emotions, not about poor time management.",
        examples: [
          {
            situation: "Project",
            detail: "Scrolling on your phone instead of starting because the task feels stressful."
          }
        ]
      }, {
        title: "Stress and Coping",
        category: "Emotions",
        description: "Stress is the body's response to demands. Healthy coping includes exercise, rest, and talking to someone you trust.",
        examples: [
          {
            situation: "Exam",
            detail: "Taking a short walk before an exam to calm your nerves."
          }
        ]
      }, {
        title: "Emotional Regulation",
        category: "Emotions",
        description: "The ability to notice, understand, and manage our feelings so they do not control our actions.",
        examples: [
          {
            situation: "Messaging",
            detail: "Taking a deep breath before replying to an annoying message."
          }
        ]
      }, {
        title: "Peer Pressure",
        category: "Social",
        description: "The influence of people around us that pushes us to change our behavior, attitudes, or choices to fit in.",
        examples: [
          {
            situation: "Barkada",
            detail: "Joining an activity you do not really want to do because everyone else is going."
          }
        ]
      }, {
        title: "First Impressions",
        category: "Social",
        description: "People form opinions about others within seconds, and these early judgments can strongly shape later impressions.",
        examples: [
          {
            situation: "Classroom",
            detail: "Judging a new teacher as strict based only on their serious expression on day one."
          }
        ]
      }, {
        title: "Habit Formation",
        category: "Habits",
        description: "Habits form through a cycle of cue, routine, and reward. Repeating the cycle makes the behavior automatic.",
        examples: [
          {
            situation: "Morning",
            detail: "Feeling tired (cue), drinking coffee (routine), feeling alert (reward)."
          }
        ]
      }, {
        title: "Sleep and the Mind",
        category: "Habits",
        description: "Good sleep supports memory, mood, and focus. Lack of sleep makes us more irritable and less able to concentrate.",
        examples: [
          {
            situation: "Class",
            detail: "Making more mistakes after staying up late."
          }
        ]
      }
    ]

    var parent = document.getElementById("parent");

    for (var i = 0; i < topics.length; i++) {

      var examplesHtml = "";
      for (var j = 0; j < topics[i].examples.length; j++) {
        examplesHtml += `
          <li><b>` + topics[i].examples[j].situation + `:</b> ` + topics[i].examples[j].detail + `</li>
        `;
      }

      parent.innerHTML += `
        <div class="col-12">
          <div class="card topic-card my-3 shadow rounded-3 p-3">
            <div class="category-tag text-uppercase">` + topics[i].category + `</div>
            <div class="topic-title h2">` + topics[i].title + `</div>
            <div class="my-3">` + topics[i].description + `</div>
            <div class="examples-label fw-bold">Examples</div>
            <ul>` + examplesHtml + `</ul>
          </div>
        </div>
      `;
    }
  </script>

</body>

</html>
